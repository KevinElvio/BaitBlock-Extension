<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Checker</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h2>Phishing Checker</h2>
    
    <div class="url-display">
        <label>URL yang sedang dibuka:</label>
        <input type="text" id="urlInput" placeholder="URL akan muncul di sini" readonly />
    </div>
    
    <button id="checkBtn">Periksa URL</button>
    
    <div id="result" class="hidden"></div>
    
    <div id="analysisDetails" class="analysis-details hidden">
        <h3>Detail Analisis:</h3>
        <div class="details-grid" id="detailsGrid"></div>
    </div>
    
    <div class="button-group">
        <button id="viewDetailsBtn" class="secondary-btn hidden">Lihat Detail</button>
        <button id="closeBtn" class="secondary-btn hidden">Tutup</button>
    </div>
    
    <footer>
        Phishing Checker © 2026
        <div class="powered-by">Powered by XGBoost</div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
